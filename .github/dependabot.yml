version: 2

# Commit types stay hidden in release-please-config.json, so dependency
# updates never propose a Release PR or show up in a CHANGELOG.
updates:
  # The root manifest covers every workspace under packages/.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
